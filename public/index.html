
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="chat-box">
            <h2>🎓 AI Student Assistant</h2>
            <p>Your personal learning companion</p>

            <div id="chatMessages" class="messages">
                <div class="bot-message">
                    Hello! How can I help you with your studies today?
                </div>
            </div>

            <form id="chatForm">
                <div class="input-group mt-3">
                    <input type="text" id="messageInput"
                    class="form-control" placeholder="Ask your question..." required>
                    <button class="btn btn-primary" type="submit">Send</button>
                </div>
            </form>
            <p id="errorMessage"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
